<!DOCTYPE html>
<html lang="be" data-title-key="pages.game.title">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAVAR — Гульня</title>
  <link rel="icon" type="image/svg+xml" href="JaVar_icon.svg" />
  <!-- Fonts: async, non-blocking for rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://shared.akamai.steamstatic.com" />
  <link rel="preconnect" href="https://cdn.akamai.steamstatic.com" />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Jaro&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Jaro&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
  /></noscript>
  
  
  
  <link rel="stylesheet" href="styles.css?v=3" />
  <style>
    /* ── Translation Cards ─────────────────────────── */
    .translation-cards { display: flex; flex-direction: column; gap: 16px; }

    .translation-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color .2s;
    }
    .translation-card.active { border-color: var(--accent); }

    .translation-card__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      cursor: pointer;
      gap: 16px;
    }

    .translation-card__left { display: flex; flex-direction: column; gap: 6px; }

    .translation-card__studio {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .translation-card__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .translation-card__right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .translation-card__rating {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
    }
    .translation-card__rating span {
      font-size: 13px;
      color: var(--text-muted);
    }

    .translation-card__body {
      border-top: 1px solid var(--border);
      padding: 20px 22px;
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .translation-card.active .translation-card__body { display: flex; }

    .translation-card__info-row {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }
    .translation-card__info-item { display: flex; flex-direction: column; gap: 4px; }
    .translation-card__info-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .translation-card__info-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .translation-card__go {
      align-self: flex-start;
    }

    .platform-links { display:flex; flex-wrap:wrap; gap:8px; }
    .platform-link {
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      color:var(--text);
      background:var(--surface-2);
      font-size:13px;
      font-weight:700;
      transition:border-color .2s, color .2s;
    }
    .platform-link:hover { border-color:var(--accent); color:var(--accent); }

    /* ── Reviews section ──────────────────────────── */
    .reviews-block { display: flex; flex-direction: column; gap: 14px; }

    /* ── Stars selector ───────────────────────────── */
    .stars-input { display: flex; gap: 4px; cursor: pointer; }
    .stars-input span {
      font-size: 26px;
      color: var(--border);
      transition: color .15s;
      user-select: none;
      line-height: 1;
    }
    .stars-input span.on { color: var(--accent); }

    /* ── Anonymous name input ─────────────────────── */
    .anon-input {
      width: 100%;
      height: 44px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 16px;
      font-size: 14px;
      color: var(--text);
      font-family: var(--font-body);
      transition: border-color .2s;
    }
    .anon-input::placeholder { color: var(--text-muted); }
    .anon-input:focus { outline: none; border-color: var(--accent); }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    /* ── Loading state ────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>
<body>
<div class="page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar__logo" aria-label="JAVAR">
      <img src="JaVar_SVG.svg" alt="JAVAR" style="height:28px;width:auto;display:block" />
    </a>
    <ul class="navbar__links">
      <li><a href="index.html" data-i18n="common.nav.home">Галоўная</a></li>
      <li><a href="catalog.html" data-i18n="common.nav.catalog">Каталог</a></li>
      <li><a href="contacts.html" data-i18n="common.nav.contacts">Кантакты</a></li>
      <li><a href="faq.html" data-i18n="common.nav.faq">FAQ</a></li>
    </ul>
    <div class="navbar__submit-item"><button type="button" class="navbar__submit" data-open-submission data-i18n="common.nav.submit">Дадаць беларусізатар</button></div>
    <div class="navbar__search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="5" stroke="#7A7A9A" stroke-width="1.5"/>
        <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="#7A7A9A" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Пошук..." data-i18n-placeholder="common.nav.searchPlaceholder" />
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="main-content">
    <!-- Filled by JS -->
    <div style="display:flex;flex-direction:column;gap:16px;padding-top:24px;">
      <div class="skeleton" style="height:20px;width:300px"></div>
      <div class="skeleton" style="height:48px;width:480px"></div>
      <div class="skeleton" style="height:400px;width:100%"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__brand">
      <span class="footer__logo">
        <img src="JaVar_SVG.svg" alt="JAVAR" style="height:24px;width:auto;display:block" />
      </span>
      <span class="footer__copy" data-i18n="common.footer.copyright">© 2024 САА «БЫВАЕ»</span>
    </div>
    <ul class="footer__nav">
      <li><a href="index.html" data-i18n="common.nav.home">Галоўная</a></li>
      <li><a href="catalog.html" data-i18n="common.nav.catalog">Каталог</a></li>
      <li><a href="contacts.html" data-i18n="common.nav.contacts">Кантакты</a></li>
      <li><a href="faq.html" data-i18n="common.nav.faq">FAQ</a></li>
    </ul>
  </footer>
</div>

<script src="texts.js?v=3"></script>
<script src="submission.js?v=3"></script>
<script>
const API = '';  // same origin

// ── Helpers ──────────────────────────────────────────────────────────────
function stars(n, total = 5) {
  return Array.from({length: total}, (_, i) => i < Math.round(n) ? '★' : '☆').join('');
}

function formatDate(value) {
  if (!value) return '—';
  const localized = String(value).match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if (localized) return `${localized[1]}-${localized[2]}-${localized[3]}`;
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  const dd = String(date.getDate()).padStart(2, '0');
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const yyyy = date.getFullYear();
  return `${dd}-${mm}-${yyyy}`;
}

function badge(type) {
  if (type === 'manual') return `<span class="badge badge--manual">${t('common.translationTypes.manualShort')}</span>`;
  return `<span class="badge badge--ai">${t('common.translationTypes.aiShort')}</span>`;
}

function esc(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
  }[ch]));
}

function platformStoreURL(platform, game) {
  const name = String(platform || '').toLowerCase();
  const plainTitle = game.title || '';
  const encodedTitle = encodeURIComponent(plainTitle);
  if (name === 'xbox') return `https://www.xbox.com/search?q=${encodedTitle}`;
  if (name === 'playstation') return `https://store.playstation.com/search/${encodedTitle}`;
  if (name === 'nintendo switch') return `https://www.nintendo.com/search/#q=${encodedTitle}&p=1&cat=gme`;
  if (name === 'ios') return `https://www.apple.com/search/${encodedTitle}?src=serp`;
  if (name === 'android') return `https://play.google.com/store/search?q=${encodedTitle}&c=apps`;

  const title = game.title ? `"${game.title}"` : '';
  const developer = game.developer ? `"${game.developer}"` : '';
  const stores = {
    windows: 'Steam GOG Epic Games Microsoft Store',
    macos: 'Steam GOG Epic Games Mac App Store',
    linux: 'Steam GOG itch.io'
  };
  const query = `${title} ${developer} game ${platform} official store buy ${stores[name] || 'store'}`.trim();
  return `https://search.brave.com/search?q=${encodeURIComponent(query)}`;
}

function renderPlatformLinks(game) {
  const platforms = game.platforms || [];
  if (!platforms.length) return '—';
  return `<div class="platform-links">${platforms.map(platform => `
    <a class="platform-link" href="${esc(platformStoreURL(platform, game))}" target="_blank" rel="noopener">${esc(platform)}</a>
  `).join('')}</div>`;
}

// ── Render game page ──────────────────────────────────────────────────────
function renderGame(game) {
  document.title = `JAVAR — ${game.title}`;
  const translations = game.translations || [];
  const bestTranslation = translations.reduce((best, current) => {
    const bestRating = best?.avg_rating || 0;
    const currentRating = current?.avg_rating || 0;
    return currentRating > bestRating ? current : best;
  }, null);
  const bestAvgRating = (bestTranslation?.avg_rating || 0) > 0
    ? bestTranslation.avg_rating.toFixed(1)
    : '—';

  const genreTags = (game.genres || []).map(g =>
    `<span class="badge badge--genre">${g.name}</span>`
  ).join('');

  const translationCards = translations.map((t, i) =>
    renderTranslationCard(t, i === 0)
  ).join('');

  document.getElementById('main-content').innerHTML = `
    <!-- Breadcrumb -->
    <nav class="breadcrumb">
      <a href="index.html">${t('common.nav.home')}</a>
      <span class="breadcrumb__sep">›</span>
      <a href="catalog.html">${t('common.nav.catalog')}</a>
      <span class="breadcrumb__sep">›</span>
      <span class="breadcrumb__current">${game.title}</span>
    </nav>

    <!-- Title -->
    <div class="game-title-block">
      <h1>${game.title}</h1>
      <div class="game-title-block__bar"></div>
    </div>

    <!-- Stat bar - full width -->
    <div style="display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap">
      <div class="stat-card" style="flex:1;min-width:140px">
        <div class="stat-card__label">Steam</div>
        <div class="stat-card__value stat-card__value--green">${game.steam_rating != null ? game.steam_rating + '%' : '—'}</div>
        <div class="stat-card__sub">${t('pages.game.steamPositive')}</div>
      </div>
      <div class="stat-card" style="flex:1;min-width:140px">
        <div class="stat-card__label">${t('pages.game.translationRating')}</div>
        <div class="stat-card__value" style="color:var(--accent)">${bestAvgRating}</div>
        <div class="stat-card__sub">${t('pages.game.avgRating')}</div>
      </div>
      <div class="stat-card" style="flex:1;min-width:140px">
        <div class="stat-card__label">${t('pages.game.translationsCount')}</div>
        <div class="stat-card__value" style="color:var(--text)">${(game.translations||[]).length}</div>
        <div class="stat-card__sub">${t('pages.game.available')}</div>
      </div>
      <div class="stat-card" style="flex:1;min-width:140px">
        <div class="stat-card__label">${t('pages.game.totalClicks')}</div>
        <div class="stat-card__value" style="color:var(--text-muted)">${(game.translations||[]).reduce((s,t)=>s+(t.click_count||0),0)}</div>
        <div class="stat-card__sub">${t('pages.game.searchClicks')}</div>
      </div>
    </div>

    <!-- Layout -->
    <div class="game-layout">
      <!-- Cover -->
      <div class="game-cover-col">
        <div class="game-cover" style="${game.cover_url
          ? ''
          : `background:linear-gradient(160deg,#0a0a14,#1a0505)`}">
          ${game.cover_url ? `<img class="cover-img" src="${game.cover_url}" alt="${game.title}" loading="eager" decoding="async" fetchpriority="high" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block"/>` : ''}
          ${!game.cover_url ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;opacity:.1">👻</div>` : ''}
        </div>
      </div>

      <!-- Right -->
      <div>
        <!-- Info table -->
        <div class="info-table">
          <div class="info-row">
            <div class="info-cell">
              <span class="info-cell__label">${t('pages.game.releaseDate')}</span>
              <span class="info-cell__value">${formatDate(game.release_date)}</span>
            </div>
            <div class="info-cell">
              <span class="info-cell__label">${t('pages.game.developer')}</span>
              <span class="info-cell__value">${game.developer}</span>
            </div>
          </div>
          <div class="info-row">
            <div class="info-cell">
              <span class="info-cell__label">${t('pages.game.publisher')}</span>
              <span class="info-cell__value">${game.publisher || '—'}</span>
            </div>
            <div class="info-cell">
              <span class="info-cell__label">${t('pages.game.genres')}</span>
              <div class="tag-list">${genreTags}</div>
            </div>
            <div class="info-cell">
              <span class="info-cell__label">${t('pages.game.platforms')}</span>
              <div class="info-cell__value">${renderPlatformLinks(game)}</div>
            </div>
          </div>
        </div>

        <!-- Description -->
        <div style="margin-top:20px">
          <h3 class="section-h2">${t('pages.game.aboutGame')}</h3>
          <p class="game-desc">${game.description || ''}</p>
        </div>
      </div>
    </div>

    <!-- Translations -->
    <div class="section" style="margin-top:52px">
      <h3 class="section-h2">${t('pages.game.translations')}</h3>
      <div class="translation-cards" id="translation-cards">
        ${translationCards}
      </div>
    </div>

    <!-- Reviews (for first translation by default) -->
    ${translations.length > 0 ? renderReviewsSection(translations[0]) : ''}
  `;

  // Expand/collapse card headers
  document.querySelectorAll('.translation-card__head').forEach(head => {
    head.addEventListener('click', () => {
      const card = head.closest('.translation-card');
      const wasActive = card.classList.contains('active');
      document.querySelectorAll('.translation-card').forEach(c => c.classList.remove('active'));
      if (!wasActive) {
        card.classList.add('active');
        const tid = card.dataset.tid;
        loadReviews(parseInt(tid));
      }
    });
  });

  // "Go to" buttons
  document.querySelectorAll('.btn-goto').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const tid = btn.dataset.tid;
      try {
        const res = await fetch(`${API}/api/translations/${tid}/click`, {method:'POST'});
        const data = await res.json();
        window.open(data.url, '_blank', 'noopener');
      } catch {
        alert(t('pages.game.linkError'));
      }
    });
  });

  // First card is open by default: load its reviews
  if (translations.length > 0) {
    loadReviews(translations[0].id);
  }
}


const ORTH_LABELS = { academic: t('common.orthography.academic'), tarashkevitsa: t('common.orthography.tarashkevitsa'), lacinka: t('common.orthography.lacinka') };
const OFFICIAL_LABELS = { official: t('common.officialStatus.official'), 'semi-official': t('common.officialStatus.semiOfficial'), unofficial: t('common.officialStatus.unofficial') };
function translationName(translation) {
  return (translation?.translator_names || []).join(', ') || t('pages.game.translatorFallback');
}
function renderTranslationCard(t, open = false) {
  const coverageHTML = (t.coverage || []).map(c =>
    `<span class="tag-sm tag-sm--neutral">${c}</span>`
  ).join('');
  const translatorsHTML = (t.translator_names || []).join(', ') || '—';
  const avgStr = t.avg_rating > 0 ? t.avg_rating.toFixed(1) : '—';

  return `
    <div class="translation-card ${open ? 'active' : ''}" data-tid="${t.id}">
      <div class="translation-card__head">
        <div class="translation-card__left">
          <div class="translation-card__studio">${translationName(t)}</div>
          <div class="translation-card__meta">
            ${badge(t.type)}
            <span class="tag-sm" style="font-size:10px;padding:2px 7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted)">${OFFICIAL_LABELS[t.official_status] || window.t('common.officialStatus.unofficial')}</span>
            ${(t.orthography||[]).map(o => `<span class="tag-sm" style="font-size:10px;padding:2px 7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted)">${ORTH_LABELS[o] || o}</span>`).join(' ')}
            <span style="font-size:12px;color:var(--text-muted)">${window.t('pages.game.clicks', { count: t.click_count })}</span>
          </div>
        </div>
        <div class="translation-card__right">
          <div class="translation-card__rating">
            ${avgStr} <span>/ 5.0</span>
          </div>
          <div class="stars" style="font-size:14px;letter-spacing:2px">${stars(t.avg_rating)}</div>
            <div style="font-size:11px;color:var(--text-muted)">${window.t('common.labels.reviewCount', { count: t.review_count })}</div>
        </div>
      </div>
      <div class="translation-card__body">
        <div class="translation-card__info-row">
          <div class="translation-card__info-item">
            <span class="translation-card__info-label">${window.t('pages.game.authors')}</span>
            <span class="translation-card__info-value">${translatorsHTML}</span>
          </div>
          <div class="translation-card__info-item">
            <span class="translation-card__info-label">${window.t('pages.game.translated')}</span>
            <div class="tag-list">${coverageHTML}</div>
          </div>
        </div>
        <button class="btn btn--primary translation-card__go btn-goto" data-tid="${t.id}">
          ${window.t('pages.game.findTranslation')}
        </button>
      </div>
    </div>
  `;
}

// ── Reviews ───────────────────────────────────────────────────────────────
function renderReviewsSection(t) {
  return `
    <div class="section" style="margin-top:52px" id="reviews-section">
      <h3 class="section-h2" id="reviews-title">${window.t('pages.game.reviewsFor', { name: translationName(t) })}</h3>

      <!-- Rating summary -->
      <div id="rating-summary"></div>

      <!-- Review form -->
      <div style="margin:24px 0 20px">
        <h4 style="font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text)">${window.t('pages.game.leaveReview')}</h4>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div>
            <label class="form-label" for="review-name">${window.t('pages.game.nameOptional')}</label>
            <input class="anon-input" id="review-name" type="text" placeholder="${window.t('pages.game.anonymous')}" maxlength="60"/>
          </div>
          <div>
            <label class="form-label">${window.t('pages.game.rating')}</label>
            <div class="stars-input" id="stars-input">
              <span data-v="1">★</span>
              <span data-v="2">★</span>
              <span data-v="3">★</span>
              <span data-v="4">★</span>
              <span data-v="5">★</span>
            </div>
          </div>
          <div>
            <label class="form-label" for="review-body">${window.t('pages.game.comment')}</label>
            <textarea class="review-textarea" id="review-body" placeholder="${window.t('pages.game.reviewPlaceholder')}"></textarea>
          </div>
          <div style="display:flex;justify-content:flex-end">
            <button class="btn btn--primary" id="submit-review"
              style="height:40px;padding:0 24px"
              data-tid="${t.id}">
              ${window.t('common.actions.submit')}
            </button>
          </div>
        </div>
      </div>

      <!-- Reviews list -->
      <div class="reviews-block" id="reviews-list">
        <div class="skeleton" style="height:100px;width:100%"></div>
      </div>
    </div>
  `;
}

// Keep game data globally
let _gameData = null;

function loadReviews(tid) {
  const section = document.getElementById('reviews-section');
  if (!section) return;

  // Find translation in cached game data
  const translation = (_gameData?.translations || []).find(t => t.id === tid);
  const studioName = translationName(translation);

  // Update section title
  const titleEl = document.getElementById('reviews-title');
  if (titleEl) titleEl.textContent = t('pages.game.reviewsFor', { name: studioName });

  // Update data-tid on submit button
  const submitBtn = document.getElementById('submit-review');
  if (submitBtn) submitBtn.dataset.tid = tid;

  const listEl   = document.getElementById('reviews-list');
  const ratingEl = document.getElementById('rating-summary');

  // Reviews are already present in payload: no extra request needed
  const reviews = translation?.reviews || [];

  if (reviews.length > 0) {
    const avg    = reviews.reduce((s, r) => s + r.rating, 0) / reviews.length;
    const counts = [0,0,0,0,0];
    reviews.forEach(r => counts[r.rating - 1]++);
    ratingEl.innerHTML = renderRatingSummary(avg, reviews.length, counts);
    listEl.innerHTML   = reviews.map(renderReviewCard).join('');
  } else {
    ratingEl.innerHTML = '';
    listEl.innerHTML   = `<p style="color:var(--text-muted);font-size:14px">${t('pages.game.noReviews')}</p>`;
  }
}

// Reload reviews after posting by fetching full game payload again
async function reloadReviews(tid) {
  try {
    const slug = new URLSearchParams(location.search).get('slug');
    const res  = await fetch(`${API}/api/games/${slug}`);
    if (!res.ok) return;
    _gameData = await res.json();
    loadReviews(tid);
  } catch {
    const listEl = document.getElementById('reviews-list');
    if (listEl) listEl.innerHTML = `<p style="color:var(--text-muted)">${t('pages.game.updateError')}</p>`;
  }
}

function renderRatingSummary(avg, total, counts) {
  const bars = [5,4,3,2,1].map(n => {
    const pct = total > 0 ? Math.round(counts[n-1] / total * 100) : 0;
    return `
      <div class="rating-bar">
        <span class="rating-bar__num">${n}</span>
        <div class="rating-bar__track"><div class="rating-bar__fill" style="width:${pct}%"></div></div>
        <span class="rating-bar__count">${counts[n-1]}</span>
      </div>`;
  }).join('');

  return `
    <div class="rating-summary">
      <div class="rating-summary__left">
        <div class="rating-summary__score">${avg.toFixed(1)}</div>
        <div class="stars rating-summary__stars">${stars(avg)}</div>
        <div class="rating-summary__count">${t('common.labels.reviewCount', { count: total })}</div>
      </div>
      <div class="rating-bars">${bars}</div>
    </div>`;
}

function renderReviewCard(rev) {
  const initials = rev.author_name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  return `
    <div class="review-card">
      <div class="review-card__header">
        <div class="review-card__user">
          <div class="user-avatar">${initials}</div>
          <div>
            <div class="review-card__name">${rev.author_name}</div>
            <div class="review-card__date">${formatDate(rev.created_at)}</div>
          </div>
        </div>
        <div class="stars review-card__stars">${stars(rev.rating)}</div>
      </div>
      <p class="review-card__text">${rev.body}</p>
    </div>`;
}

// ── Stars input ───────────────────────────────────────────────────────────
let selectedRating = 0;

document.addEventListener('click', (e) => {
  const star = e.target.closest('#stars-input span');
  if (!star) return;
  selectedRating = parseInt(star.dataset.v);
  document.querySelectorAll('#stars-input span').forEach(s => {
    s.classList.toggle('on', parseInt(s.dataset.v) <= selectedRating);
  });
});

document.addEventListener('mouseover', (e) => {
  const star = e.target.closest('#stars-input span');
  if (!star) return;
  const v = parseInt(star.dataset.v);
  document.querySelectorAll('#stars-input span').forEach(s => {
    s.classList.toggle('on', parseInt(s.dataset.v) <= v);
  });
});

document.addEventListener('mouseout', (e) => {
  if (!e.target.closest('#stars-input')) return;
  document.querySelectorAll('#stars-input span').forEach(s => {
    s.classList.toggle('on', parseInt(s.dataset.v) <= selectedRating);
  });
});

// ── Submit review ─────────────────────────────────────────────────────────
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('#submit-review');
  if (!btn) return;

  const tid = parseInt(btn.dataset.tid);
  const name = document.getElementById('review-name').value.trim();
  const body = document.getElementById('review-body').value.trim();

  if (!selectedRating) { alert(t('pages.game.chooseRating')); return; }
  if (!body) { alert(t('pages.game.writeComment')); return; }

  btn.disabled = true;
  btn.textContent = t('common.actions.submitting');

  try {
    const res = await fetch(`${API}/api/reviews`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ translation_id: tid, author_name: name || t('pages.game.anonymous'), rating: selectedRating, body })
    });

    if (!res.ok) throw new Error();

    document.getElementById('review-name').value = '';
    document.getElementById('review-body').value = '';
    selectedRating = 0;
    document.querySelectorAll('#stars-input span').forEach(s => s.classList.remove('on'));

    await reloadReviews(tid);
  } catch {
    alert(t('pages.game.submitError'));
  } finally {
    btn.disabled = false;
    btn.textContent = t('common.actions.submit');
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
(async () => {
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) {
    document.getElementById('main-content').innerHTML =
      `<p style="color:var(--text-muted);padding:40px 0">${t('common.status.gameNotFound')} <a href="catalog.html" style="color:var(--accent)">${t('common.actions.backToCatalog')}</a></p>`;
    return;
  }

  try {
    const res = await fetch(`${API}/api/games/${slug}`);
    if (!res.ok) throw new Error();
    const game = await res.json();
    _gameData = game;
    renderGame(game);
  } catch {
    document.getElementById('main-content').innerHTML =
      `<p style="color:var(--text-muted);padding:40px 0">${t('common.status.loadingError')} <a href="catalog.html" style="color:var(--accent)">${t('common.actions.backToCatalog')}</a></p>`;
  }
})();
</script>
